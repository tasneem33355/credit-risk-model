version: "3.8"

services:
  api:
    build: .
    container_name: zawolf_credit_api
    command: uvicorn api:app --host 0.0.0.0 --port 8000 --reload
    ports:
      - "8000:8000"
    environment:
      - MODEL_DIR=model/artifacts
      - LOG_LEVEL=INFO
    volumes:
      - .:/app
    restart: unless-stopped

  dashboard:
    build: .
    container_name: zawolf_credit_dashboard
    command: streamlit run dashboard.py --server.port 8501 --server.address 0.0.0.0
    ports:
      - "8501:8501"
    depends_on:
      - api
    volumes:
      - .:/app
    restart: unless-stopped
